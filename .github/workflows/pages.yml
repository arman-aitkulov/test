name: Update NBK data & deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"   # ежедневно, 09:00 по Астане
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NBK data
        # Если сайт Нацбанка недоступен — публикуем последний закоммиченный data.json
        continue-on-error: true
        run: |
          pip install pandas openpyxl requests
          python nbk_loans/export.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898728+github-actions[bot]@users.noreply.github.com"
          git add nbk_loans/data.json
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Update NBK regional loans data"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
