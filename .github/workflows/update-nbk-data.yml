name: Update NBK data

on:
  schedule:
    - cron: "0 4 * * *"   # ежедневно, 09:00 по Астане
  workflow_dispatch:

# GitHub Pages публикуется из ветки main («Deploy from branch»),
# поэтому достаточно закоммитить обновлённый data.json.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch NBK data
        run: |
          pip install pandas openpyxl requests
          python nbk_loans/export.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898728+github-actions[bot]@users.noreply.github.com"
          git add nbk_loans/data.json
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Update NBK regional loans data"
            git push
          fi
